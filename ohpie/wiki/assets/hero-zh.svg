<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">OhPie — AI 科研工作台</title>
  <desc id="heroDesc">OhPie 字标，右侧为研究工作区结构：literature、experiments、manuscript 与 .ohpie，说明对话随课题保存在工作区中。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBF9"/>
      <stop offset="1" stop-color="#F6F1E8"/>
    </linearGradient>
    <pattern id="rules" width="1200" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 39.5H1200" stroke="#F0EADA" stroke-width="1"/>
    </pattern>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBF9"/>
      <stop offset="1" stop-color="#F3EFE7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#paper)"/>
  <rect width="1200" height="420" rx="26" fill="url(#rules)"/>
  <rect x="0.7" y="0.7" width="1198.6" height="418.6" rx="25.4" fill="none" stroke="#DCD6CA" stroke-width="1.4"/>

  <g id="brand-mark" transform="translate(64 58) scale(0.109375)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#plate)" stroke="#DCD6CA" stroke-width="3.2"/>
    <path d="M 387.25 298.64 A 138.0 138.0 0 1 1 284.69 121.02" fill="none" stroke="#141413" stroke-width="34" stroke-linecap="round"/>
    <circle cx="375.51" cy="187.00" r="22.5" fill="#D97757"/>
    <path d="M 196 212 L 316 212" fill="none" stroke="#141413" stroke-width="32" stroke-linecap="round"/>
    <path d="M 230 212 Q 228 260 218 308" fill="none" stroke="#141413" stroke-width="30" stroke-linecap="round"/>
    <path d="M 282 212 L 282 286 Q 282 310 304 310" fill="none" stroke="#141413" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="masthead" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="140" y="86" font-size="18" font-weight="600" letter-spacing="2.2" fill="#6B645A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace">AI 科研工作台</text>
    <text x="140" y="112" font-size="16" letter-spacing="1.2" fill="#9A9285" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace">ELECTRON · PI 运行时 · WINDOWS x64</text>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="232" font-size="92" font-weight="700" letter-spacing="-2" fill="#141413">OhPie</text>
    <text x="64" y="308" font-size="31" letter-spacing="1" font-family="Georgia, 'Songti SC', 'SimSun', serif" fill="#3A3733">文献、分析、图表与手稿，</text>
    <text x="64" y="348" font-size="31" letter-spacing="1" font-family="Georgia, 'Songti SC', 'SimSun', serif" fill="#3A3733">都在同一个科研工作区。</text>
  </g>

  <g id="metadata" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace" font-size="16" letter-spacing="0.6" fill="#9A9285">
    <text x="64" y="390">MIT 许可 · 英文 / 简体中文 / 繁体中文</text>
  </g>

  <g id="workspace-panel">
    <rect x="704" y="56" width="432" height="312" rx="18" fill="#141413" opacity="0.04"/>
    <rect x="704" y="52" width="432" height="312" rx="18" fill="#FFFDFA" stroke="#DCD6CA" stroke-width="1.4"/>

    <text x="736" y="88" font-size="17" letter-spacing="2" fill="#6B645A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace">研究工作区</text>
    <path d="M736 102H1104" stroke="#E3DCCD" stroke-width="1"/>

    <text x="736" y="144" font-size="20.5" font-weight="650" fill="#141413" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">research-topic/</text>
    <text x="736" y="180" font-size="20.5" fill="#141413" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">├─ literature/</text>
    <text x="736" y="216" font-size="20.5" fill="#141413" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">├─ experiments/</text>
    <text x="736" y="252" font-size="20.5" fill="#141413" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">├─ manuscript/</text>
    <text x="736" y="288" font-size="20.5" fill="#141413" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">└─ .ohpie/</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace" font-size="17" fill="#9A9285" text-anchor="end">
      <text x="1104" y="180">论文</text>
      <text x="1104" y="216">分析</text>
      <text x="1104" y="252">草稿</text>
      <text x="1104" y="288">会话</text>
    </g>

    <circle cx="742" cy="330" r="5" fill="#D97757"/>
    <text x="758" y="336" font-size="17" fill="#A9563A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Microsoft YaHei', monospace">对话随课题一起保存</text>
  </g>
</svg>
